services:
  # Backend API Web Service
  - type: web
    name: apple-worm-adventure-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_NAME
        value: APPLE WORM ADVENTURE
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

  # Frontend Static Site
  - type: web
    name: apple-worm-adventure-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GAME_NAME
        value: APPLE WORM ADVENTURE
      - key: VITE_API_URL
        sync: false
