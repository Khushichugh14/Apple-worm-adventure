services:
  # Full-Stack Web Service — Express serves both API + React frontend
  - type: web
    name: apple-worm-adventure
    runtime: node
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_NAME
        value: APPLE WORM ADVENTURE
      - key: VITE_API_URL
        value: /api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://apple-worm-adventure.onrender.com
