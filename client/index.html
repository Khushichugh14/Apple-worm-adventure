<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
  <meta name="theme-color" content="#05070d"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="description" content="Apple Worm Adventure - A premium strategic puzzle game. Guide your worm through 50 handcrafted gardens across 5 mystical realms. Collect apples, avoid obstacles, and master the art of slithering!"/>
  <meta name="keywords" content="puzzle game, worm game, apple worm, strategic puzzle, mobile game, browser game, casual game"/>
  <meta name="author" content="Apple Worm Adventure"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Apple Worm"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <title>Apple Worm Adventure</title>
  <style>
    html,body{margin:0;height:100%;background:#05070d;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    #app-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 30%,#102a22 0%,#05070d 55%,#020308 100%);z-index:9999;transition:opacity .35s ease,visibility .35s ease}
    #app-splash.hidden{opacity:0;visibility:hidden}
    .splash-mark{width:84px;height:84px;border-radius:24px;background:linear-gradient(145deg,#10b981,#065f46);display:grid;place-items:center;box-shadow:0 18px 40px rgba(16,185,129,.35),inset 0 1px 0 rgba(255,255,255,.25);animation:splashFloat 2.2s ease-in-out infinite}
    .splash-mark svg{width:52px;height:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
    .splash-title{font-weight:800;letter-spacing:.08em;font-size:14px;color:#d1fae5;text-transform:uppercase}
    .splash-sub{font-size:12px;color:#94a3b8}
    .splash-bar{width:160px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .splash-bar i{display:block;height:100%;width:45%;border-radius:inherit;background:linear-gradient(90deg,#34d399,#38bdf8,#a78bfa);animation:splashLoad 1.2s ease-in-out infinite}
    @keyframes splashFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes splashLoad{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion: reduce){.splash-mark,.splash-bar i{animation:none}}
  </style>
</head>
<body>
  <div id="app-splash" aria-label="Loading Apple Worm Adventure" role="status">
    <div class="splash-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="34" r="12" fill="#34d399"/><circle cx="42" cy="34" r="10" fill="#10b981"/><circle cx="39" cy="30" r="3" fill="#fff"/><circle cx="40" cy="30" r="1.4" fill="#0f172a"/><path d="M18 36c4 4 9 4 12 0" stroke="#065f46" stroke-width="3" stroke-linecap="round"/><path d="M46 22c6-6 10-4 12 2-6 2-10 1-12-2z" fill="#ef4444"/><path d="M46 22c2-6 6-8 8-6" stroke="#92400e" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <div class="splash-title">Apple Worm Adventure</div>
    <div class="splash-sub">Preparing your garden realms…</div>
    <div class="splash-bar"><i></i></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
