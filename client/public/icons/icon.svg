<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="wormGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff7b7b"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle pattern -->
  <g opacity="0.1">
    <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 10"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Worm body segments -->
  <g filter="url(#shadow)">
    <!-- Tail -->
    <ellipse cx="180" cy="340" rx="45" ry="38" fill="url(#wormGrad)" transform="rotate(-30 180 340)"/>
    <!-- Segment 3 -->
    <ellipse cx="210" cy="300" rx="48" ry="42" fill="url(#wormGrad)" transform="rotate(-15 210 300)"/>
    <!-- Segment 2 -->
    <ellipse cx="245" cy="260" rx="50" ry="45" fill="url(#wormGrad)" transform="rotate(0 245 260)"/>
    <!-- Segment 1 -->
    <ellipse cx="285" cy="230" rx="52" ry="48" fill="url(#wormGrad)" transform="rotate(15 285 230)"/>
    <!-- Head base -->
    <circle cx="330" cy="210" r="60" fill="url(#wormGrad)"/>
  </g>

  <!-- Head highlight -->
  <ellipse cx="315" cy="190" rx="20" ry="14" fill="#ffffff" opacity="0.5" transform="rotate(-25 315 190)"/>

  <!-- Rosy cheeks -->
  <ellipse cx="295" cy="225" rx="10" ry="7" fill="#fb7185" opacity="0.9"/>
  <ellipse cx="365" cy="225" rx="10" ry="7" fill="#fb7185" opacity="0.9"/>

  <!-- Eyes -->
  <g transform="translate(310, 195)">
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="4" cy="0" r="9" fill="#0f172a"/>
    <circle cx="2" cy="-3" r="4" fill="#ffffff"/>
    <circle cx="6" cy="3" r="2" fill="#ffffff"/>
  </g>

  <g transform="translate(350, 195)">
    <ellipse cx="0" cy="0" rx="14" ry="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="4" cy="0" r="9" fill="#0f172a"/>
    <circle cx="2" cy="-3" r="4" fill="#ffffff"/>
    <circle cx="6" cy="3" r="2" fill="#ffffff"/>
  </g>

  <!-- Smile -->
  <path d="M305 240 Q330 255 355 240" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Leaf sprout on head -->
  <g transform="translate(320, 145)">
    <path d="M8 25 C8 10, 30 5, 34 15 C38 25, 20 30, 8 25 Z" fill="#4ade80" stroke="#15803d" stroke-width="2.5"/>
    <path d="M8 25 C18 18, 30 15, 34 15" stroke="#166534" stroke-width="2" fill="none"/>
    <path d="M8 25 Q4 38 8 45" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Apple near tail -->
  <g transform="translate(140, 380)" filter="url(#shadow)">
    <!-- Stem -->
    <path d="M0 0 Q8 -18 20 -25" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Leaf -->
    <path d="M8 0 C25 -15, 45 -10, 50 -2 C52 -8, 35 -18, 18 -10 Z" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <!-- Apple body -->
    <path d="M0 20 C-25 20, -35 40, -35 60 C-35 80, -15 90, 0 88 C15 90, 35 80, 35 60 C35 40, 25 20, 0 20 Z" fill="url(#appleGrad)"/>
    <!-- Highlight -->
    <path d="M-15 35 C-18 45, -12 60, -5 68" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="-20" cy="30" r="5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Sparkle stars -->
  <g fill="#fef08a" filter="url(#glow)">
    <polygon points="100,80 105,90 115,92 105,100 100,110 95,100 85,92 95,90" transform="scale(0.8)"/>
    <polygon points="400,120 404,127 412,129 404,135 400,142 396,135 388,129 396,127" transform="scale(0.6)"/>
    <polygon points="150,420 153,426 159,428 153,432 150,438 147,432 141,428 147,426" transform="scale(0.7)"/>
  </g>
</svg>